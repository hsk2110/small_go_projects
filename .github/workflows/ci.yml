name: REST API CI
on:
  push:
    branches:
      - main
jobs:
  build:
    defaults:
      run:
        shell: bash
        working-directory: ./rest
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: use go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: run tests
        run: go test ./...
      - name: docker build
        run: docker build -t rest_api .